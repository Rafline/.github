# Labels applied to every Rafline repository by scripts/sync-labels.sh.
# Keep one label per "- name:" block with color and description on the lines below it.
# The sync creates or updates these labels. It never deletes or renames labels.

- name: "type: feature"
  color: "1d76db"
  description: "New behaviour"
- name: "type: bug"
  color: "d73a4a"
  description: "Something does not work as it should"
- name: "type: chore"
  color: "c5def5"
  description: "Tooling, dependencies, cleanup"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"

- name: "area: api"
  color: "5319e7"
  description: "Backend API"
- name: "area: web"
  color: "5319e7"
  description: "Web app"
- name: "area: shared"
  color: "5319e7"
  description: "Shared contracts and types"
- name: "area: design"
  color: "5319e7"
  description: "Design system"
- name: "area: social"
  color: "5319e7"
  description: "Social post generator and publisher"
- name: "area: infra"
  color: "5319e7"
  description: "Hosting, CI, deploys"

- name: "version: v1"
  color: "fbca04"
  description: "Planned for v1"
- name: "version: v2"
  color: "fbca04"
  description: "Planned for v2"
- name: "version: v3"
  color: "fbca04"
  description: "Planned for v3"
- name: "version: v4"
  color: "fbca04"
  description: "Planned for v4"

- name: "priority: must"
  color: "b60205"
  description: "Required for the version it is planned in"
- name: "priority: should"
  color: "e99695"
  description: "Important, not blocking"
- name: "priority: could"
  color: "f9d0c4"
  description: "Nice to have"

- name: "blocked"
  color: "000000"
  description: "Waiting on something outside this issue"
