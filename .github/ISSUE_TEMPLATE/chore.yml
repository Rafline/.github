name: Chore
description: Tooling, dependencies, docs, cleanup or other work that does not change behaviour.
title: "chore: "
labels: ["type: chore"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
    validations:
      required: true
  - type: input
    id: notion-epic
    attributes:
      label: Notion epic ID
      placeholder: e.g. EPIC-12, or "none"
    validations:
      required: false
