name: Feature
description: Something new the product or a tool should do.
title: "feat: "
labels: ["type: feature"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What should it do?
      description: Describe the behaviour from the user's side.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves or who needs it.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The checks that tell us this is finished.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: input
    id: notion-epic
    attributes:
      label: Notion epic ID
      placeholder: e.g. EP-12, or "none"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, designs, open questions.
    validations:
      required: false
